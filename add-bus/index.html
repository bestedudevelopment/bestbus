<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>BEST | Add Bus</title>

    <link rel="stylesheet" href="./add-bus.css">
</head>

<body>

<header class="top-header">

    <button id="backButton" class="back-button">
        ←
    </button>

    <div>
        <h1>ADD BUS</h1>
        <p>BUS MANAGEMENT</p>
    </div>

</header>


<main class="page">

    <div class="page-intro">

        <div class="bus-icon">
            🚌
        </div>

        <div>
            <h2>New School Bus</h2>
            <p>
                Enter the vehicle details below.
            </p>
        </div>

    </div>


    <form id="addBusForm">

        <!-- BUS NUMBER -->

        <div class="form-group">

            <label for="busNumber">
                Bus Number
                <span>*</span>
            </label>

            <input
                type="text"
                id="busNumber"
                placeholder="Example: BUS-001"
                maxlength="30"
                required
            >

            <small>
                Internal number used by the school.
            </small>

        </div>


        <!-- REGISTRATION -->

        <div class="form-group">

            <label for="registrationNumber">
                Registration Number
                <span>*</span>
            </label>

            <input
                type="text"
                id="registrationNumber"
                placeholder="Example: KA-35-1234"
                maxlength="20"
                required
            >

        </div>


        <!-- ROUTE -->

        <div class="form-group">

            <label for="route">
                Route
                <span>*</span>
            </label>

            <input
                type="text"
                id="route"
                placeholder="Example: Route 1 - Main Road"
                maxlength="100"
                required
            >

        </div>


        <!-- EXPECTED MILEAGE -->

        <div class="form-group">

            <label for="expectedMileage">
                Expected Mileage
                <span>*</span>
            </label>

            <div class="input-with-unit">

                <input
                    type="number"
                    id="expectedMileage"
                    placeholder="Example: 2.50"
                    min="0.1"
                    max="20"
                    step="0.01"
                    required
                >

                <span>
                    KM/L
                </span>

            </div>

            <small>
                Normal mileage expected for this bus.
            </small>

        </div>


        <!-- CURRENT METER -->

        <div class="form-group">

            <label for="currentOdometer">
                Current Meter Reading
                <span>*</span>
            </label>

            <div class="input-with-unit">

                <input
                    type="number"
                    id="currentOdometer"
                    placeholder="Example: 12450"
                    min="0"
                    step="0.1"
                    required
                >

                <span>
                    KM
                </span>

            </div>

        </div>


        <!-- ERROR -->

        <div
            id="errorMessage"
            class="error-message hidden"
        ></div>


        <!-- SUCCESS -->

        <div
            id="successMessage"
            class="success-message hidden"
        ></div>


        <!-- SAVE -->

        <button
            type="submit"
            id="saveButton"
            class="save-button"
        >

            <span id="saveText">
                SAVE BUS
            </span>

            <span
                id="spinner"
                class="spinner hidden"
            ></span>

        </button>

    </form>


    <div class="info-box">

        <strong>Important</strong>

        <p>
            The current meter reading will become the
            starting odometer value for this vehicle.
        </p>

    </div>

</main>


<script
    type="module"
    src="./add-bus.js"
></script>

</body>
</html>
