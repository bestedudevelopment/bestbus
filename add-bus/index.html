<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Bus</title>

    <link
        rel="stylesheet"
        href="./add-bus.css"
    >
</head>

<body>

    <header class="header">

        <a
            href="../admin/"
            class="back-link"
        >
            ← ADMIN
        </a>

        <img
            src="../logo.png"
            alt="Logo"
            class="logo"
        >

    </header>


    <main class="container">

        <section class="intro">

            <span class="eyebrow">
                FLEET
            </span>

            <h1>
                Add Bus
            </h1>

            <p>
                Register a vehicle and establish its initial odometer.
            </p>

        </section>


        <div
            id="message"
            class="message hidden"
        ></div>


        <form id="busForm">

            <!-- BUS NUMBER -->
            <div class="field">

                <label for="busNumber">
                    BUS NUMBER
                </label>

                <input
                    id="busNumber"
                    type="text"
                    placeholder="Example: BUS 01"
                    autocomplete="off"
                    required
                >

            </div>


            <!-- REGISTRATION -->
            <div class="field">

                <label for="registrationNumber">
                    REGISTRATION NUMBER
                </label>

                <input
                    id="registrationNumber"
                    type="text"
                    placeholder="Example: KA 01 AB 1234"
                    autocomplete="off"
                    required
                >

            </div>


            <!-- STARTING ODOMETER -->
            <div class="field">

                <label for="startingOdometer">
                    STARTING ODOMETER
                </label>

                <div class="input-with-unit">

                    <input
                        id="startingOdometer"
                        type="number"
                        inputmode="decimal"
                        min="0"
                        step="0.1"
                        placeholder="Example: 12000"
                        required
                    >

                    <span>
                        KM
                    </span>

                </div>

                <small>
                    This becomes the initial odometer for the bus.
                    The driver will not enter this every morning.
                </small>

            </div>


            <!-- EXPECTED MILEAGE -->
            <div class="field">

                <label for="expectedMileage">
                    EXPECTED MILEAGE
                </label>

                <div class="input-with-unit">

                    <input
                        id="expectedMileage"
                        type="number"
                        inputmode="decimal"
                        min="0"
                        step="0.01"
                        placeholder="Example: 5"
                        required
                    >

                    <span>
                        KM/L
                    </span>

                </div>

                <small>
                    Used later for the fuel-average monitoring system.
                </small>

            </div>


            <button
                id="saveButton"
                type="submit"
                class="save-button"
            >
                CREATE BUS
            </button>

        </form>


        <a
            href="../buses/"
            class="secondary-link"
        >
            VIEW ALL BUSES →
        </a>

    </main>


    <script
        type="module"
        src="./add-bus.js"
    ></script>

</body>

</html>
