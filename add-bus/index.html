<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BEST | Add Bus</title>

    <link
        rel="stylesheet"
        href="./add-bus.css"
    >

</head>

<body>

<header class="top-header">

    <div class="header-left">

        <button
            id="backButton"
            class="back-button"
            type="button"
        >
            ←
        </button>

        <div>

            <h1>ADD BUS</h1>

            <p>BUS MANAGEMENT</p>

        </div>

    </div>

</header>


<main class="page">

    <section class="intro">

        <div class="bus-icon">
            🚌
        </div>

        <div>

            <span>NEW BUS</span>

            <h2>
                Register Bus
            </h2>

            <p>
                Add a bus to your fleet.
            </p>

        </div>

    </section>


    <form id="busForm">


        <div class="form-group">

            <label for="busNumber">
                Bus Number <b>*</b>
            </label>

            <input
                id="busNumber"
                type="text"
                placeholder="Example: BUS-001"
                maxlength="30"
                required
            >

        </div>


        <div class="form-group">

            <label for="registrationNumber">
                Registration Number <b>*</b>
            </label>

            <input
                id="registrationNumber"
                type="text"
                placeholder="Example: KA-35-1234"
                maxlength="30"
                required
            >

        </div>


        <div class="form-group">

            <label for="route">
                Route
            </label>

            <input
                id="route"
                type="text"
                placeholder="Example: Hagaribommanahalli → Town"
                maxlength="150"
            >

        </div>


        <div class="two-column">

            <div class="form-group">

                <label for="expectedMileage">
                    Expected Mileage
                </label>

                <input
                    id="expectedMileage"
                    type="number"
                    placeholder="Example: 4.5"
                    min="0"
                    step="0.01"
                >

                <small>
                    KM per litre
                </small>

            </div>


            <div class="form-group">

                <label for="currentOdometer">
                    Current Odometer
                </label>

                <input
                    id="currentOdometer"
                    type="number"
                    placeholder="Example: 12500"
                    min="0"
                    step="1"
                >

                <small>
                    Current KM
                </small>

            </div>

        </div>


        <div class="status-box">

            <div>

                <strong>
                    Bus Status
                </strong>

                <p>
                    Make this bus available for operations.
                </p>

            </div>

            <label class="switch">

                <input
                    id="active"
                    type="checkbox"
                    checked
                >

                <span class="slider"></span>

            </label>

        </div>


        <div
            id="errorMessage"
            class="message error hidden"
        ></div>


        <div
            id="successMessage"
            class="message success hidden"
        ></div>


        <button
            id="saveButton"
            class="save-button"
            type="submit"
        >

            <span id="saveText">
                ADD BUS
            </span>

            <span
                id="spinner"
                class="spinner hidden"
            ></span>

        </button>

    </form>

</main>


<script
    type="module"
    src="./add-bus.js"
></script>

</body>

</html>
