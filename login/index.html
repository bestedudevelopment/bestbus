<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>BEST Bus Application</title>

    <link rel="stylesheet" href="./login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <!-- Logo -->
            <div class="brand">

                <div class="bus-logo">
                    <span>🚌</span>
                </div>

                <h1>BEST</h1>

                <p class="institution">
                    BEST ENGLISH MEDIUM SCHOOL<br>
                    AND PU COLLEGE
                </p>

                <p class="transport-title">
                    TRANSPORT MANAGEMENT
                </p>

            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span id="loginButtonText">
                        LOGIN
                    </span>

                    <span
                        id="loginSpinner"
                        class="spinner hidden"
                    ></span>

                </button>


                <div
                    id="errorMessage"
                    class="error-message hidden"
                ></div>

            </form>


            <div class="footer">

                <p>BEST TRANSPORT</p>

                <span>
                    School Bus Management System
                </span>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="./login.js"
    ></script>

</body>
</html>
