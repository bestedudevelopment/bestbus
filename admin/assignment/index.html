<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BEST Bus — Assign / Deassign</title>

    <link rel="stylesheet" href="./style.css">

</head>


<body>


<header class="app-header">

    <div class="header-left">

        <a href="../" class="back-btn">
            ←
        </a>

        <div class="brand">

            <img
                src="../../logo.png"
                alt="BEST"
                class="logo"
            >

            <div>

                <div class="brand-name">
                    BEST
                </div>

                <div class="brand-subtitle">
                    Fleet Management
                </div>

            </div>

        </div>

    </div>


    <div class="header-admin">
        ADMIN
    </div>

</header>



<main class="app-main">


    <!-- PAGE HEADER -->

    <section class="page-heading">

        <span class="eyebrow">
            FLEET MANAGEMENT
        </span>

        <h1>
            Assign / Deassign
        </h1>

        <p>
            Manage drivers and buses.
        </p>

    </section>



    <!-- =====================================================
         CURRENT ASSIGNMENTS
    ====================================================== -->

    <section class="section">

        <div class="section-heading">

            <div>

                <span class="section-label">
                    CURRENT
                </span>

                <h2>
                    Assigned
                </h2>

            </div>


            <span
                id="assignedCount"
                class="count-badge"
            >
                0
            </span>

        </div>


        <div
            id="assignedList"
            class="assigned-list"
        >

            <div class="loading">
                Loading assignments...
            </div>

        </div>

    </section>



    <!-- =====================================================
         AVAILABLE DRIVERS
    ====================================================== -->

    <section class="section">

        <div class="section-heading">

            <div>

                <span class="section-label">
                    AVAILABLE
                </span>

                <h2>
                    Drivers
                </h2>

            </div>


            <span
                id="driverCount"
                class="count-badge"
            >
                0
            </span>

        </div>


        <div
            id="driverList"
            class="selection-list"
        >

            <div class="loading">
                Loading drivers...
            </div>

        </div>

    </section>



    <!-- =====================================================
         AVAILABLE BUSES
    ====================================================== -->

    <section class="section">

        <div class="section-heading">

            <div>

                <span class="section-label">
                    AVAILABLE
                </span>

                <h2>
                    Buses
                </h2>

            </div>


            <span
                id="busCount"
                class="count-badge"
            >
                0
            </span>

        </div>


        <div
            id="busList"
            class="selection-list"
        >

            <div class="loading">
                Loading buses...
            </div>

        </div>

    </section>



    <!-- =====================================================
         ASSIGN PANEL
    ====================================================== -->

    <section
        id="assignPanel"
        class="assign-panel hidden"
    >

        <div class="selected-box">

            <span>
                DRIVER
            </span>

            <strong id="selectedDriver">
                —
            </strong>

        </div>


        <div class="plus">
            +
        </div>


        <div class="selected-box">

            <span>
                BUS
            </span>

            <strong id="selectedBus">
                —
            </strong>

        </div>


        <button
            id="assignButton"
            class="assign-button"
            disabled
        >
            ASSIGN BUS
        </button>

    </section>



    <!-- MESSAGE -->

    <div
        id="message"
        class="message hidden"
    ></div>


</main>



<!-- =====================================================
     MOBILE NAV
====================================================== -->

<nav class="bottom-nav">

    <a
        href="../"
        class="bottom-link"
    >
        <span>⌂</span>
        <small>Home</small>
    </a>


    <a
        href="../#fleet"
        class="bottom-link"
    >
        <span>▣</span>
        <small>Fleet</small>
    </a>


    <a
        href="../drivers/"
        class="bottom-link"
    >
        <span>●</span>
        <small>Drivers</small>
    </a>


    <a
        href="./"
        class="bottom-link active"
    >
        <span>↔</span>
        <small>Assign</small>
    </a>

</nav>



<script
    type="module"
    src="./script.js"
></script>


</body>

</html>
