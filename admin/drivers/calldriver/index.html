<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Call Driver | BEST Bus</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">
            BEST
        </div>

        <div>
            <strong>BEST</strong>
            <small>CALL DRIVER</small>
        </div>

    </div>

    <button id="logoutButton">
        LOG OUT
    </button>

</header>


<main class="page">

    <button
        id="backButton"
        class="back"
    >
        ← BACK
    </button>


    <section class="intro">

        <span>DRIVER MANAGEMENT</span>

        <h1>Call Driver</h1>

        <p>
            Contact a driver assigned to a bus.
        </p>

    </section>


    <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Search driver or bus..."
    >


    <section id="driversList">

        <div class="empty">
            Loading drivers...
        </div>

    </section>

</main>


<script
    type="module"
    src="./script.js"
></script>

</body>

</html>
