<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

    <!-- 2 SECOND SPLASH -->

    <div id="splash" class="splash">

        <img
            src="../logo.png"
            alt="Logo"
        >

    </div>


    <!-- ADMIN -->

    <div id="adminPage" class="admin-page">

        <header class="topbar">

            <div class="brand">

                <img
                    src="../logo.png"
                    alt="Logo"
                    class="brand-logo"
                >

                <div class="brand-text">

                    <span>
                        BEST
                    </span>

                    <strong>
                        English Medium School
                        & International PU College
                    </strong>

                </div>

            </div>


            <div class="admin-label">
                ADMIN
            </div>

        </header>


        <main class="container">


            <!-- WELCOME -->

            <section class="welcome">

                <span>
                    ADMINISTRATION
                </span>

                <h1>
                    Welcome, Admin
                </h1>

                <p>
                    Manage your school transportation system.
                </p>

            </section>


            <!-- FOUR SMALL BOXES -->

            <section class="quick-grid">


                <div class="quick-card">

                    <div class="icon bus-icon">
                        🚌
                    </div>

                    <strong id="totalBuses">
                        0
                    </strong>

                    <span>
                        TOTAL BUSES
                    </span>

                </div>


                <div class="quick-card">

                    <div class="icon">
                        👤
                    </div>

                    <strong id="totalDrivers">
                        0
                    </strong>

                    <span>
                        TOTAL DRIVERS
                    </span>

                </div>


                <a
                    href="../add-bus/"
                    class="quick-card action-card"
                >

                    <div class="icon yellow-icon">
                        +
                    </div>

                    <strong>
                        ADD
                    </strong>

                    <span>
                        ADD BUS
                    </span>

                </a>


                <a
                    href="../add-driver/"
                    class="quick-card action-card"
                >

                    <div class="icon yellow-icon">
                        +
                    </div>

                    <strong>
                        ADD
                    </strong>

                    <span>
                        ADD DRIVER
                    </span>

                </a>


            </section>


            <!-- BUS INFORMATION -->

            <section class="bus-section">

                <div class="section-heading">

                    <div>

                        <span>
                            FLEET
                        </span>

                        <h2>
                            Bus Overview
                        </h2>

                    </div>

                </div>


                <div id="busList">

                    <!-- Bus cards will load here -->

                </div>

            </section>


        </main>

    </div>


    <script
        type="module"
        src="./script.js"
    ></script>

</body>
</html>
