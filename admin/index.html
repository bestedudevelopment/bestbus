<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

    <!-- LOADING SCREEN -->

    <div id="loadingScreen">

        <img
            src="../logo.png"
            alt="Logo"
            class="loading-logo"
        >

    </div>


    <!-- ADMIN DASHBOARD -->

    <div
        id="adminPage"
        class="hidden"
    >

        <!-- TOP BAR -->

        <header class="topbar">

            <div class="brand">

                <img
                    src="../logo.png"
                    alt="Logo"
                    class="brand-logo"
                >

                <div class="brand-text">

                    <span>
                        BEST
                    </span>

                    <strong>
                        English Medium School &
                        International PU College
                    </strong>

                </div>

            </div>
<div class="top-actions">

    <span id="adminName">
        Admin
    </span>

    <button
        id="logoutBtn"
        type="button"
    >
        LOGOUT
    </button>

</div>

        </header>


        <!-- CONTENT -->

        <main class="container">


            <!-- WELCOME -->

            <section class="welcome">

                <span>
                    ADMINISTRATION
                </span>

                <h1>
                    Welcome, Admin
                </h1>

                <p>
                    Manage your school bus operations.
                </p>

            </section>


            <!-- FOUR BOXES -->

            <section class="quick-grid">


                <!-- TOTAL BUSES -->

                <div class="quick-card">

                    <div class="quick-icon yellow">
                        🚌
                    </div>

                    <span>
                        TOTAL BUSES
                    </span>

                    <strong id="totalBuses">
                        0
                    </strong>

                </div>


                <!-- TOTAL DRIVERS -->

                <div class="quick-card">

                    <div class="quick-icon black">
                        👤
                    </div>

                    <span>
                        TOTAL DRIVERS
                    </span>

                    <strong id="totalDrivers">
                        0
                    </strong>

                </div>


                <!-- ADD BUS -->

                <a
                    href="../add-bus/"
                    class="quick-card action-card"
                >

                    <div class="quick-icon yellow">
                        +
                    </div>

                    <span>
                        ADD BUS
                    </span>

                    <strong>
                        →
                    </strong>

                </a>


                <!-- ADD DRIVER -->

                <a
                    href="../add-driver/"
                    class="quick-card action-card"
                >

                    <div class="quick-icon black">
                        +
                    </div>

                    <span>
                        ADD DRIVER
                    </span>

                    <strong>
                        →
                    </strong>

                </a>


            </section>


            <!-- BUS OVERVIEW -->

            <section class="bus-section">

                <div class="section-title">

                    <div>

                        <span>
                            FLEET
                        </span>

                        <h2>
                            Bus Overview
                        </h2>

                    </div>

                </div>


                <div
                    id="busList"
                    class="bus-list"
                >

                    <!-- BUS CARDS WILL COME HERE -->

                </div>

            </section>


        </main>

    </div>


    <script
        type="module"
        src="./script.js"
    ></script>

</body>

</html>
