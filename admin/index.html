<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin | Bus Management</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

    <!-- HEADER -->

    <header class="topbar">

        <div class="brand">

            <img
                src="../logo.png"
                alt="Logo"
                class="logo"
            >

            <div>
                <span class="brand-small">
                    BUS MANAGEMENT
                </span>

                <h1>
                    Admin
                </h1>
            </div>

        </div>


        <div class="top-actions">

            <span id="adminName">
                Admin
            </span>

            <button
                id="logoutBtn"
                class="logout-btn"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="container">


        <!-- WELCOME -->

        <section class="welcome">

            <span class="section-label">
                ADMIN PANEL
            </span>

            <h2>
                Fleet Overview
            </h2>

            <p>
                Manage buses, drivers and daily operations.
            </p>

        </section>


        <!-- DASHBOARD CARDS -->

        <section class="dashboard-grid">


            <div class="dashboard-card">

                <div class="card-icon yellow">
                    BUS
                </div>

                <div>

                    <span>
                        TOTAL BUSES
                    </span>

                    <strong id="totalBuses">
                        0
                    </strong>

                </div>

            </div>


            <div class="dashboard-card">

                <div class="card-icon black">
                    DR
                </div>

                <div>

                    <span>
                        TOTAL DRIVERS
                    </span>

                    <strong id="totalDrivers">
                        0
                    </strong>

                </div>

            </div>


            <div class="dashboard-card">

                <div class="card-icon yellow">
                    AS
                </div>

                <div>

                    <span>
                        ASSIGNED
                    </span>

                    <strong id="assignedBuses">
                        0
                    </strong>

                </div>

            </div>


            <div class="dashboard-card alert-card">

                <div class="card-icon red">
                    !
                </div>

                <div>

                    <span>
                        RED FLAGS
                    </span>

                    <strong id="redFlags">
                        0
                    </strong>

                </div>

            </div>


        </section>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message hidden"
        ></div>


        <!-- BUS SECTION -->

        <section class="panel-section">

            <div class="section-header">

                <div>

                    <span class="section-label">
                        FLEET
                    </span>

                    <h2>
                        Buses
                    </h2>

                </div>


                <button
                    id="showAddBusBtn"
                    class="yellow-btn"
                    type="button"
                >
                    + ADD BUS
                </button>

            </div>


            <!-- ADD BUS -->

            <div
                id="addBusPanel"
                class="add-panel hidden"
            >

                <div class="add-panel-title">
                    ADD NEW BUS
                </div>


                <div class="form-grid">

                    <div class="field">

                        <label for="busNumber">
                            BUS NUMBER
                        </label>

                        <input
                            id="busNumber"
                            type="text"
                            placeholder="TEST BUS 1"
                        >

                    </div>


                    <div class="field">

                        <label for="registrationNumber">
                            REGISTRATION NUMBER
                        </label>

                        <input
                            id="registrationNumber"
                            type="text"
                            placeholder="KA 35 AB 1234"
                        >

                    </div>


                    <div class="field">

                        <label for="startingOdometer">
                            STARTING ODOMETER
                        </label>

                        <div class="unit-input">

                            <input
                                id="startingOdometer"
                                type="number"
                                min="0"
                                step="0.1"
                                placeholder="12000"
                            >

                            <span>
                                KM
                            </span>

                        </div>

                    </div>


                    <div class="field">

                        <label for="expectedMileage">
                            EXPECTED MILEAGE
                        </label>

                        <div class="unit-input">

                            <input
                                id="expectedMileage"
                                type="number"
                                min="0"
                                step="0.01"
                                placeholder="5"
                            >

                            <span>
                                KM/L
                            </span>

                        </div>

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        id="cancelBusBtn"
                        class="cancel-btn"
                        type="button"
                    >
                        CANCEL
                    </button>

                    <button
                        id="saveBusBtn"
                        class="black-btn"
                        type="button"
                    >
                        CREATE BUS
                    </button>

                </div>

            </div>


            <!-- BUS LIST -->

            <div
                id="busList"
                class="list"
            >

                <div class="empty">
                    Loading buses...
                </div>

            </div>

        </section>


        <!-- DRIVER SECTION -->

        <section class="panel-section">

            <div class="section-header">

                <div>

                    <span class="section-label">
                        PEOPLE
                    </span>

                    <h2>
                        Drivers
                    </h2>

                </div>

            </div>


            <div
                id="driverList"
                class="list"
            >

                <div class="empty">
                    Loading drivers...
                </div>

            </div>

        </section>


    </main>


    <script
        type="module"
        src="./script.js"
    ></script>

</body>

</html>
