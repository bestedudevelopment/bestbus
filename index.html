
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>BEST Bus Management</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#fff;color:#111827;padding:16px}
.login-box{width:100%;max-width:360px;padding:28px;border:1px solid #e5e7eb;border-radius:12px}
.bus-scene{height:62px;display:flex;justify-content:center;align-items:center;margin-bottom:12px;overflow:hidden}
.bus{position:relative;width:88px;height:35px;background:#2563eb;border-radius:7px 11px 5px 5px;animation:drive 3s ease-in-out infinite}
.bus:before{content:"";position:absolute;top:6px;left:7px;width:55px;height:13px;background:#fff;border-radius:3px}
.bus:after{content:"";position:absolute;right:5px;top:8px;width:13px;height:12px;background:#bfdbfe;border-radius:3px}
.wheel{position:absolute;bottom:-6px;width:13px;height:13px;border:3px solid #374151;background:#fff;border-radius:50%;animation:roll .8s linear infinite}
.wheel.one{left:13px}.wheel.two{right:13px}
@keyframes drive{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
@keyframes roll{to{transform:rotate(360deg)}}
h2{text-align:center;font-size:24px;font-weight:600;margin-bottom:5px}
.subtitle{text-align:center;color:#6b7280;font-size:14px;margin-bottom:25px}
input[type=radio]{display:none}
.tabs{display:flex;background:#f3f4f6;padding:4px;border-radius:8px;margin-bottom:24px}
.tabs label{width:50%;padding:11px;text-align:center;cursor:pointer;border-radius:6px;font-size:14px;color:#6b7280}
#admin:checked~.login-box .tabs label[for=admin],#driver:checked~.login-box .tabs label[for=driver]{background:#fff;color:#111827;box-shadow:0 1px 4px #00000012}
.form{display:none}
#admin:checked~.login-box .admin-form,#driver:checked~.login-box .driver-form{display:block}
.google-btn,.login-btn{width:100%;padding:12px;border:none;border-radius:7px;background:#2563eb;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.google-btn:hover,.login-btn:hover{background:#1d4ed8}
button:disabled{opacity:.6;cursor:wait}
.field{display:block;width:100%;padding:12px;margin-bottom:12px;border:1px solid #d1d5db;border-radius:7px;font-size:14px;outline:none}
.field:focus{border-color:#2563eb}
.message{display:none;margin-top:15px;padding:11px;border-radius:7px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.message.show{display:block}
.error{background:#fef2f2;color:#b91c1c}
@media(max-width:420px){.login-box{padding:24px}}
@media(prefers-reduced-motion:reduce){.bus,.wheel{animation:none}}
</style>
</head>

<body>
<input type="radio" name="role" id="admin" checked>
<input type="radio" name="role" id="driver">

<div class="login-box">
  <div class="bus-scene">
    <div class="bus">
      <span class="wheel one"></span>
      <span class="wheel two"></span>
    </div>
  </div>

  <h2>BEST</h2>
  <p class="subtitle">Bus Management System</p>

  <div class="tabs">
    <label for="admin">Admin</label>
    <label for="driver">Driver</label>
  </div>

  <div class="form admin-form">
    <button class="google-btn" id="googleBtn" type="button">
      Continue with Google
    </button>
  </div>

  <form class="form driver-form" id="driverForm">
    <input class="field" id="username" type="text"
      placeholder="Username" autocomplete="username" required>
    <input class="field" id="password" type="password"
      placeholder="Password" autocomplete="current-password" required>
    <button class="login-btn" id="driverBtn" type="submit">Login</button>
  </form>

  <div class="message error" id="message" role="alert"></div>
</div>

<script type="module">


import { auth, db } from "./firebase.js";

import {
  GoogleAuthProvider,
  signInWithPopup,
  signInWithRedirect,
  getRedirectResult,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import { loginUser } from "./auth.js";

const ADMIN_EMAIL = "admin.svtbest@gmail.com";

const $ = id => document.getElementById(id);

function showMessage(text) {
  const el = $("message");
  el.textContent = text;
  el.className = "message show error";
}

function clearMessage() {
  $("message").textContent = "";
  $("message").className = "message";
}

const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

let googleBusy = false;

// Verify that the Google account is the authorized admin.
async function verifyAdmin(user) {
  if ((user.email || "").toLowerCase() !== ADMIN_EMAIL) {
    await signOut(auth);
    showMessage(
      "This email is not registered with the admin portal."
    );
    return;
  }

  try {
    const snap = await getDoc(doc(db, "users", user.uid));

    if (!snap.exists() ||
        String(snap.data().role || "").toLowerCase() !== "admin") {
      await signOut(auth);
      showMessage("Admin profile not found. Contact the administrator.");
      return;
    }

    location.href = "admin/";
  } catch (error) {
    console.error("Admin verification:", error);
    await signOut(auth);
    showMessage("Could not verify admin access. Check Firestore permissions.");
  }
}

// Complete Google redirect sign-in if the browser returns from Google.
try {
  const result = await getRedirectResult(auth);
  if (result?.user) await verifyAdmin(result.user);
} catch (error) {
  console.error("Google redirect:", error);
  showMessage("Google sign-in failed. Please try again.");
}

// Google button
$("googleBtn").addEventListener("click", async () => {
  if (googleBusy) return;

  googleBusy = true;
  clearMessage();

  const btn = $("googleBtn");
  btn.disabled = true;
  btn.textContent = "Connecting to Google...";

  try {
    const result = await signInWithPopup(auth, provider);
    await verifyAdmin(result.user);
  } catch (error) {
    console.error("Google login error:", error);

    if (error.code === "auth/popup-blocked") {
      await signInWithRedirect(auth, provider);
      return;
    }

    if (error.code === "auth/unauthorized-domain") {
      showMessage("Add this website domain in Firebase Authentication settings.");
    } else if (error.code === "auth/operation-not-allowed") {
      showMessage("Enable Google sign-in in Firebase Console.");
    } else if (error.code === "auth/popup-closed-by-user") {
      showMessage("Google sign-in cancelled. Please try again.");
    } else {
      showMessage("Google login failed: " + (error.code || error.message));
    }
  } finally {
    googleBusy = false;
    btn.disabled = false;
    btn.textContent = "Continue with Google";
  }
});

// Driver login
$("driverForm").addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage();

  const username = $("username").value.trim();
  const password = $("password").value;
  const btn = $("driverBtn");

  if (!username || !password) {
    showMessage("Enter username and password.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Signing in...";

  try {
    // auth.js must export loginUser(username, password).
    const result = await loginUser(username, password);

    // Support either a Firebase User or { user: FirebaseUser }.
    const user = result?.user || result;

    if (!user?.uid) {
      showMessage("User not found. Contact admin.");
      return;
    }

    const snap = await getDoc(doc(db, "users", user.uid));
    const profile = snap.exists() ? snap.data() : {};

    if (String(profile.role || "").toLowerCase() !== "driver" ||
        profile.disabled === true ||
        String(profile.status || "").toLowerCase() === "disabled") {
      await signOut(auth);
      showMessage("User not found. Contact admin.");
      return;
    }

    location.href = profile.portalPath || "driver/";

  } catch (error) {
    console.error("Driver login error:", error);
    showMessage("User not found. Contact admin.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Login";
  }
});


</script>
</body>
</html>
