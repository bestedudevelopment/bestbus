<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEST Bus | Driver</title><style>
:root{--blue:#1677e8;--pale:#eaf4ff;--ink:#172b4d;--muted:#6b7b91;--line:#e4edf7;--bg:#f6faff;--green:#17835d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}.top{padding:18px 26px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.brand img{width:40px;height:40px;object-fit:contain}.btn{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:11px 15px;font-weight:750;cursor:pointer}.btn.secondary{background:#edf5ff;color:#145eb3}.wrap{max-width:980px;margin:0 auto;padding:28px 20px}.welcome{padding:25px;border-radius:18px;border:1px solid #d8eaff;background:linear-gradient(110deg,#e6f3ff,#fff);display:flex;justify-content:space-between;align-items:center;gap:15px}.welcome h1{font-size:28px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0;line-height:1.5}.bus{width:115px;height:48px;background:var(--blue);border-radius:10px 13px 5px 5px;position:relative;flex-shrink:0;animation:move 2.8s ease-in-out infinite alternate}.bus:before{content:"";position:absolute;right:9px;top:7px;width:36px;height:16px;background:#cce8ff;border-radius:3px}.bus:after{content:"BEST";position:absolute;left:9px;top:12px;color:white;font-size:11px;font-weight:900}.wheel{position:absolute;bottom:-7px;width:18px;height:18px;border-radius:50%;background:#a6b5c5;border:4px solid #263a54;animation:spin .7s linear infinite}.w1{left:17px}.w2{right:16px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes move{to{transform:translateX(-12px)}}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:21px}.card h2{font-size:17px;margin:0 0 16px}.label{color:var(--muted);font-size:12px;font-weight:750;margin-bottom:5px}.value{font-size:18px;font-weight:800;overflow-wrap:anywhere}.row{padding:12px 0;border-bottom:1px solid #edf1f6}.row:last-child{border-bottom:0}.pill{display:inline-block;background:#e9f8ef;color:var(--green);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.notice{display:none;margin:16px 0;padding:13px 15px;border-radius:10px;background:#fff3e8;color:#995100;font-size:13px;overflow-wrap:anywhere}.notice.show{display:block}.empty{color:var(--muted);line-height:1.6}.foot{text-align:center;color:#94a2b5;font-size:12px;margin:25px}@media(max-width:650px){.grid{grid-template-columns:1fr}.bus{display:none}.top{padding:14px 16px}.wrap{padding:18px 14px}.welcome h1{font-size:24px}}
</style></head><body><header class="top"><div class="brand"><img src="../logo.png" alt="" onerror="this.style.display='none'"><span>BEST Bus · Driver Portal</span></div><button class="btn secondary" id="logoutBtn">Sign out</button></header><main class="wrap"><section class="welcome"><div><h1 id="hello">Welcome, Driver</h1><p>Your assigned bus information will appear here. Contact your administrator if anything is incorrect.</p></div><div class="bus"><i class="wheel w1"></i><i class="wheel w2"></i></div></section><div class="notice" id="notice"></div><div class="grid"><section class="card"><h2>My profile</h2><div class="row"><div class="label">Full name</div><div class="value" id="driverName">Loading…</div></div><div class="row"><div class="label">Phone</div><div class="value" id="driverPhone">—</div></div><div class="row"><div class="label">Email</div><div class="value" id="driverEmail">—</div></div><div class="row"><div class="label">Approval status</div><div id="approval"><span class="pill">Checking…</span></div></div></section><section class="card"><h2>My assigned bus</h2><div id="busInfo" class="empty">Loading assignment…</div></section></div><div class="foot">BEST Bus Management · Driver workspace</div></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,doc,getDoc,collection,query,where,onSnapshot}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
// Use the same exact Firebase web config as the root index.html.
const firebaseConfig = {
  apiKey: "AIzaSyCvpd7HxpLq4IJ22cMTldV3sanz35tt3H8",
  authDomain: "best----bus-application.firebaseapp.com",
  projectId: "best----bus-application",
  storageBucket: "best----bus-application.firebasestorage.app",
  messagingSenderId: "428353631166",
  appId: "1:428353631166:web:e58e03cb28a52a790e3fef",
  measurementId: "G-5XP2LE6FH1"
};


  const $=id=>document.getElementById(id);const configured=!Object.values(firebaseConfig).some(v=>String(v).includes('YOUR_'));function msg(s){$('notice').textContent=s;$('notice').classList.add('show')}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let auth,db;if(!configured)msg('Firebase setup required: replace the placeholder config in this file and the root index.html and admin/index.html.');else{try{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,async user=>{if(!user){location.href='../';return}try{const us=await getDoc(doc(db,'users',user.uid));if(!us.exists()){msg('Your account role is not configured. Ask your administrator to create users/'+user.uid+' with role "driver".');return}const role=String(us.data().role||'').toLowerCase();if(role==='admin'||role==='superadmin'){location.href='../admin/';return}if(role!=='driver'){msg('This account does not have driver access. Contact your administrator.');return}watchDriver(user,us.data())}catch(e){msg('Could not verify your account: '+e.message)}})}catch(e){msg('Firebase startup error: '+e.message)}}
function watchDriver(user,userData){const uid=user.uid;onSnapshot(doc(db,'drivers',uid),snap=>{const d=snap.exists()?snap.data():userData;$('hello').textContent='Welcome, '+(d.name||user.displayName||'Driver');$('driverName').textContent=d.name||user.displayName||'—';$('driverPhone').textContent=d.phone||'—';$('driverEmail').textContent=d.email||user.email||'—';$('approval').innerHTML=d.approved===true?'<span class="pill">Approved</span>':'<span class="pill" style="background:#fff5dd;color:#956600">Pending approval</span>';if(d.approved!==true){$('busInfo').innerHTML='<p class="empty">Your driver profile is awaiting administrator approval. Your assignment will appear here after approval.</p>';return}onSnapshot(query(collection(db,'assignments'),where('driverId','==',uid),where('active','==',true)),async s=>{if(s.empty){$('busInfo').innerHTML='<p class="empty">No bus is currently assigned to you. Please contact your administrator.</p>';return}const a=s.docs[0].data();try{const b=await getDoc(doc(db,'buses',a.busId));if(!b.exists()||b.data().deleted){$('busInfo').innerHTML='<p class="empty">The assigned bus record is unavailable. Contact your administrator.</p>';return}const x=b.data();$('busInfo').innerHTML=`<div class="row"><div class="label">Bus number</div><div class="value">${esc(x.number||'—')}</div></div><div class="row"><div class="label">Bus name</div><div class="value">${esc(x.name||'—')}</div></div><div class="row"><div class="label">Route</div><div class="value">${esc(x.route||'Not set')}</div></div><div class="row"><div class="label">Seat capacity</div><div class="value">${esc(x.capacity||'—')}</div></div>`}catch(e){msg('Could not load assigned bus: '+e.message)}},e=>msg('Could not load assignment: '+e.message))},e=>msg('Could not load driver profile: '+e.message))}
$('logoutBtn').onclick=async()=>{if(auth){await signOut(auth);location.href='../'}};
</script></body></html>
