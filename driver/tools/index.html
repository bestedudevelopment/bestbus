<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Tools | BEST Bus</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="logo">BEST</div>

        <div>
            <div class="brand-name">BEST</div>
            <div class="brand-sub">DRIVER TOOLS</div>
        </div>
    </div>

    <button id="logoutButton" class="logout">
        LOG OUT
    </button>

</header>


<main class="page">

    <button id="backButton" class="back">
        ← BACK
    </button>


    <section class="intro">
        <span>DRIVER TOOLS</span>
        <h1>Maintenance</h1>
        <p>
            Report bus problems and complete repair details.
        </p>
    </section>


    <!-- DRIVER -->

    <div class="info-card">

        <div class="icon">👤</div>

        <div>
            <small>DRIVER</small>
            <strong id="driverName">Loading...</strong>
        </div>

    </div>


    <!-- BUS -->

    <div class="bus-card">

        <div class="bus-icon">🚌</div>

        <div>
            <small>ASSIGNED BUS</small>
            <strong id="busName">Loading...</strong>
            <p id="busNumber">--</p>
        </div>

        <b>ASSIGNED</b>

    </div>


    <!-- REPORT PROBLEM -->

    <section class="card">

        <div class="section-label">
            NEW REPORT
        </div>

        <h2>Report a Problem</h2>


        <label>PROBLEM TYPE</label>

        <div class="choices">

            <button
                class="choice active"
                data-type="service"
            >
                🔧 Service / Repair
            </button>

            <button
                class="choice"
                data-type="part"
            >
                ⚙️ Part Replacement
            </button>

        </div>


        <label>PRIORITY</label>

        <div class="priority">

            <button data-priority="low">
                LOW
            </button>

            <button
                class="active"
                data-priority="normal"
            >
                NORMAL
            </button>

            <button data-priority="urgent">
                URGENT
            </button>

        </div>


        <label>PROBLEM DESCRIPTION</label>

        <textarea
            id="problem"
            placeholder="Describe the problem found in the bus..."
        ></textarea>


        <button
            id="submitProblem"
            class="primary"
        >
            SUBMIT PROBLEM
        </button>

    </section>


    <!-- WAITING / ACTIVE REPORTS -->

    <section class="section">

        <div class="section-label">
            MY REPORTS
        </div>

        <h2>Reported Problems</h2>

        <div id="reportsList">
            Loading...
        </div>

    </section>


    <!-- REPAIR DETAILS -->

    <section
        id="repairSection"
        class="card hidden"
    >

        <div class="section-label">
            REPAIR DETAILS
        </div>

        <h2>Complete Repair Details</h2>

        <div id="repairTicketInfo"></div>


        <label>WHAT WAS DONE?</label>

        <div class="choices">

            <button
                class="repair-choice active"
                data-repair="service"
            >
                🔧 Service / Repair
            </button>

            <button
                class="repair-choice"
                data-repair="part"
            >
                ⚙️ Part Replacement
            </button>

        </div>


        <label>REPAIR / SERVICE DETAILS</label>

        <textarea
            id="repairDescription"
            placeholder="Explain what was repaired or serviced..."
        ></textarea>


        <!-- PART DETAILS -->

        <div id="partFields" class="hidden">

            <label>PART REPLACED</label>

            <input
                id="partName"
                type="text"
                placeholder="Example: Brake Pad"
            >


            <label>PART COST</label>

            <input
                id="partCost"
                type="number"
                min="0"
                placeholder="₹ 0"
            >

        </div>


        <!-- LABOUR -->

        <label>LABOUR CHARGES</label>

        <input
            id="labourCost"
            type="number"
            min="0"
            placeholder="₹ 0"
        >


        <div class="total-box">

            <span>TOTAL COST</span>

            <strong id="totalCost">
                ₹0
            </strong>

        </div>


        <button
            id="submitRepair"
            class="primary"
        >
            SUBMIT REPAIR DETAILS
        </button>

    </section>


</main>


<div
    id="message"
    class="message hidden"
></div>


<script
    type="module"
    src="./script.js"
></script>

</body>
</html>
