<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#0b0b0b">

    <title>Tools | BEST Bus</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

<header class="topbar">

    <a href="../" class="back-btn">
        ←
    </a>

    <div class="brand-block">
        <div class="brand">BEST</div>
        <div class="brand-sub">DRIVER TOOLS</div>
    </div>

</header>


<main class="page">

    <section class="intro">

        <div class="eyebrow">
            VEHICLE MAINTENANCE
        </div>

        <h1>
            Report a<br>
            Problem
        </h1>

        <p>
            Found something wrong with your assigned bus?
            Report it to the administration.
        </p>

    </section>


    <!-- ASSIGNED BUS -->

    <section class="bus-card">

        <div class="bus-icon">
            🚌
        </div>

        <div class="bus-info">

            <span class="label">
                YOUR ASSIGNED BUS
            </span>

            <strong id="busNumber">
                Loading...
            </strong>

            <span id="busRegistration">
                Checking assignment...
            </span>

        </div>

        <div
            id="busStatus"
            class="bus-status loading"
        >
            ●
        </div>

    </section>


    <!-- FORM -->

    <form
        id="problemForm"
        class="form"
    >

        <div class="field">

            <label for="problem">
                WHAT IS THE PROBLEM?
            </label>

            <textarea
                id="problem"
                placeholder="Describe what you noticed..."
                rows="6"
                required
            ></textarea>

        </div>


        <div class="field">

            <label>
                PROBLEM TYPE
            </label>

            <div class="type-list">


                <label class="type-option">

                    <input
                        type="radio"
                        name="problemType"
                        value="service"
                        required
                    >

                    <div class="type-card">

                        <div class="type-icon">
                            🔧
                        </div>

                        <div class="type-text">

                            <strong>
                                Service / Repair
                            </strong>

                            <span>
                                Something needs to be checked or serviced.
                            </span>

                        </div>

                        <div class="radio-circle"></div>

                    </div>

                </label>


                <label class="type-option">

                    <input
                        type="radio"
                        name="problemType"
                        value="replacement"
                    >

                    <div class="type-card">

                        <div class="type-icon">
                            ⚙️
                        </div>

                        <div class="type-text">

                            <strong>
                                Part Replacement
                            </strong>

                            <span>
                                A vehicle part may need replacement.
                            </span>

                        </div>

                        <div class="radio-circle"></div>

                    </div>

                </label>


            </div>

        </div>


        <button
            type="submit"
            id="submitButton"
            class="submit-btn"
            disabled
        >
            REPORT PROBLEM
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </form>

</main>


<script
    type="module"
    src="./script.js"
></script>

</body>
</html>
