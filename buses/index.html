<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BEST | Buses</title>

    <link
        rel="stylesheet"
        href="./buses.css"
    >

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header class="top-header">

    <div class="header-left">

        <button
            id="backButton"
            class="back-button"
            type="button"
        >
            ←
        </button>

        <div>

            <h1>BUSES</h1>

            <p>BUS MANAGEMENT</p>

        </div>

    </div>


    <button
        id="addBusButton"
        class="add-button"
        type="button"
    >
        + ADD BUS
    </button>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="page">


    <!-- SUMMARY -->

    <section class="summary">

        <div>

            <span>
                TOTAL BUSES
            </span>

            <strong id="totalBuses">
                0
            </strong>

        </div>


        <div>

            <span>
                ACTIVE
            </span>

            <strong id="activeBuses">
                0
            </strong>

        </div>


        <div>

            <span>
                AVAILABLE
            </span>

            <strong id="availableBuses">
                0
            </strong>

        </div>

    </section>


    <!-- SEARCH -->

    <div class="search-box">

        <span class="search-icon">
            🔎
        </span>

        <input
            id="searchInput"
            type="search"
            placeholder="Search bus, registration or route..."
            autocomplete="off"
        >

    </div>


    <!-- FILTER -->

    <div class="filter-row">

        <button
            class="filter-button active"
            data-filter="all"
            type="button"
        >
            ALL
        </button>

        <button
            class="filter-button"
            data-filter="active"
            type="button"
        >
            ACTIVE
        </button>

        <button
            class="filter-button"
            data-filter="available"
            type="button"
        >
            AVAILABLE
        </button>

        <button
            class="filter-button"
            data-filter="assigned"
            type="button"
        >
            ASSIGNED
        </button>

    </div>


    <!-- BUS CONTAINER -->

    <section
        id="busContainer"
        class="bus-container"
    >

        <div class="loading">

            <div class="loading-spinner"></div>

            <span>
                Loading buses...
            </span>

        </div>

    </section>


</main>


<!-- =========================
     REFRESH
========================= -->

<button
    id="refreshButton"
    class="floating-refresh"
    type="button"
    title="Refresh"
>
    ↻
</button>


<script
    type="module"
    src="./buses.js"
></script>

</body>

</html>
