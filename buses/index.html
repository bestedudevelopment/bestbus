<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>BEST | Buses</title>

    <link rel="stylesheet" href="./buses.css">
</head>

<body>

<header class="top-header">

    <div class="header-left">

        <button id="backButton" class="back-button">
            ←
        </button>

        <div>
            <h1>BUS MANAGEMENT</h1>
            <p id="busSummary">Loading...</p>
        </div>

    </div>

    <button id="addBusButton" class="add-button">
        + ADD BUS
    </button>

</header>


<main class="page">

    <section class="page-heading">

        <div>
            <span>FLEET</span>
            <h2>All Buses</h2>
        </div>

        <button
            id="refreshButton"
            class="refresh-button"
        >
            ↻
        </button>

    </section>


    <section
        id="busContainer"
        class="bus-container"
    >

        <div class="loading">
            Loading buses...
        </div>

    </section>

</main>


<nav class="bottom-nav">

    <a href="../admin/" class="nav-item">
        <span>⌂</span>
        <small>Home</small>
    </a>

    <a href="./" class="nav-item active">
        <span>🚌</span>
        <small>Buses</small>
    </a>

    <a href="../drivers/" class="nav-item">
        <span>👨‍✈️</span>
        <small>Drivers</small>
    </a>

    <a href="../reports/" class="nav-item">
        <span>📊</span>
        <small>Reports</small>
    </a>

</nav>


<script
    type="module"
    src="./buses.js"
></script>

</body>
</html>
