<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BEST | Drivers</title>

    <link
        rel="stylesheet"
        href="./drivers.css"
    >

</head>

<body>

<header class="top-header">

    <div class="header-left">

        <button
            id="backButton"
            class="back-button"
            type="button"
        >
            ←
        </button>

        <div>

            <h1>DRIVERS</h1>

            <p>DRIVER MANAGEMENT</p>

        </div>

    </div>


    <button
        id="addDriverButton"
        class="add-button"
        type="button"
    >
        + ADD DRIVER
    </button>

</header>


<main class="page">


    <!-- SUMMARY -->

    <section class="summary">

        <div>

            <span>TOTAL DRIVERS</span>

            <strong id="totalDrivers">
                0
            </strong>

        </div>


        <div>

            <span>ACTIVE</span>

            <strong id="activeDrivers">
                0
            </strong>

        </div>


        <div>

            <span>ASSIGNED</span>

            <strong id="assignedDrivers">
                0
            </strong>

        </div>

    </section>


    <!-- SEARCH -->

    <div class="search-box">

        <span>
            🔎
        </span>

        <input
            id="searchInput"
            type="search"
            placeholder="Search driver, phone or email..."
            autocomplete="off"
        >

    </div>


    <!-- FILTER -->

    <div class="filter-row">

        <button
            class="filter-button active"
            data-filter="all"
            type="button"
        >
            ALL
        </button>

        <button
            class="filter-button"
            data-filter="active"
            type="button"
        >
            ACTIVE
        </button>

        <button
            class="filter-button"
            data-filter="assigned"
            type="button"
        >
            ASSIGNED
        </button>

        <button
            class="filter-button"
            data-filter="unassigned"
            type="button"
        >
            UNASSIGNED
        </button>

    </div>


    <!-- DRIVER LIST -->

    <section
        id="driverContainer"
        class="driver-container"
    >

        <div class="loading">

            <div class="loading-spinner"></div>

            <span>
                Loading drivers...
            </span>

        </div>

    </section>

</main>


<button
    id="refreshButton"
    class="floating-refresh"
    type="button"
>
    ↻
</button>


<script
    type="module"
    src="./drivers.js"
></script>

</body>

</html>
