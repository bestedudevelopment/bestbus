<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>BEST | Drivers</title>

    <link rel="stylesheet" href="./drivers.css">

</head>

<body>

<header class="top-header">

    <div class="header-left">

        <button
            id="backButton"
            class="back-button"
        >
            ←
        </button>

        <div>

            <h1>DRIVER MANAGEMENT</h1>

            <p id="driverSummary">
                Loading drivers...
            </p>

        </div>

    </div>


    <button
        id="addDriverButton"
        class="add-button"
    >
        + ADD DRIVER
    </button>

</header>


<main class="page">

    <!-- PAGE TITLE -->

    <section class="page-heading">

        <div>

            <span>TRANSPORT STAFF</span>

            <h2>
                All Drivers
            </h2>

        </div>


        <button
            id="refreshButton"
            class="refresh-button"
        >
            ↻
        </button>

    </section>


    <!-- SEARCH -->

    <div class="search-box">

        <span>
            🔍
        </span>

        <input
            type="search"
            id="searchInput"
            placeholder="Search driver..."
        >

    </div>


    <!-- DRIVER LIST -->

    <section
        id="driverContainer"
        class="driver-container"
    >

        <div class="loading">

            Loading drivers...

        </div>

    </section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <a
        href="../admin/"
        class="nav-item"
    >

        <span>⌂</span>

        <small>
            Home
        </small>

    </a>


    <a
        href="../buses/"
        class="nav-item"
    >

        <span>🚌</span>

        <small>
            Buses
        </small>

    </a>


    <a
        href="./"
        class="nav-item active"
    >

        <span>👨‍✈️</span>

        <small>
            Drivers
        </small>

    </a>


    <a
        href="../reports/"
        class="nav-item"
    >

        <span>📊</span>

        <small>
            Reports
        </small>

    </a>

</nav>


<script
    type="module"
    src="./drivers.js"
></script>

</body>

</html>
